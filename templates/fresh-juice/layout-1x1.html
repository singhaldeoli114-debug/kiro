<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Fresh Juice</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }

    .canvas {
      width: 1080px;
      height: 1080px;
      position: relative;
      overflow: hidden;
      background: linear-gradient(160deg, var(--surface, #ff8c00) 0%, var(--surfaceAlt, #e91e63) 100%);
      font-family: var(--font-body, 'Helvetica Neue', Arial, sans-serif);
    }

    .bg-circle-1 {
      position: absolute;
      top: -100px;
      right: -100px;
      width: 400px;
      height: 400px;
      border-radius: 50%;
      background: rgba(255,255,255,0.08);
    }

    .bg-circle-2 {
      position: absolute;
      bottom: -150px;
      left: -100px;
      width: 500px;
      height: 500px;
      border-radius: 50%;
      background: rgba(255,255,255,0.06);
    }

    .bg-circle-3 {
      position: absolute;
      top: 50%;
      left: 50%;
      transform: translate(-50%, -50%);
      width: 600px;
      height: 600px;
      border-radius: 50%;
      background: rgba(255,255,255,0.04);
    }

    .logo-area {
      position: absolute;
      top: 40px;
      left: 50%;
      transform: translateX(-50%);
      z-index: 10;
    }

    .logo-area img {
      max-height: 45px;
      width: auto;
    }

    .headline-area {
      position: absolute;
      top: 110px;
      left: 60px;
      right: 60px;
      text-align: center;
      z-index: 10;
    }

    .headline {
      font-family: var(--font-display, 'Helvetica Neue', Arial, sans-serif);
      font-size: 72px;
      font-weight: 900;
      color: var(--textPrimary, #ffffff);
      text-transform: uppercase;
      letter-spacing: 6px;
      line-height: 1;
    }

    .subheadline {
      font-family: var(--font-body, 'Helvetica Neue', Arial, sans-serif);
      font-size: 22px;
      color: var(--textSecondary, rgba(255,255,255,0.85));
      margin-top: 10px;
      letter-spacing: 4px;
      text-transform: uppercase;
    }

    .center-glass {
      position: absolute;
      top: 50%;
      left: 50%;
      transform: translate(-50%, -50%);
      width: 320px;
      height: 450px;
      display: flex;
      align-items: center;
      justify-content: center;
      z-index: 7;
    }

    .center-glass img {
      max-width: 100%;
      max-height: 100%;
      object-fit: contain;
      filter: drop-shadow(0 20px 50px rgba(0,0,0,0.3));
    }

    .fruit-orbit-1 {
      position: absolute;
      top: 250px;
      left: 100px;
      width: 160px;
      height: 160px;
      border-radius: 50%;
      overflow: hidden;
      background: rgba(255,255,255,0.15);
      display: flex;
      align-items: center;
      justify-content: center;
      z-index: 6;
    }

    .fruit-orbit-2 {
      position: absolute;
      top: 220px;
      right: 100px;
      width: 140px;
      height: 140px;
      border-radius: 50%;
      overflow: hidden;
      background: rgba(255,255,255,0.15);
      display: flex;
      align-items: center;
      justify-content: center;
      z-index: 6;
    }

    .fruit-orbit-3 {
      position: absolute;
      bottom: 260px;
      left: 140px;
      width: 130px;
      height: 130px;
      border-radius: 50%;
      overflow: hidden;
      background: rgba(255,255,255,0.15);
      display: flex;
      align-items: center;
      justify-content: center;
      z-index: 6;
    }

    .fruit-orbit-1 img,
    .fruit-orbit-2 img,
    .fruit-orbit-3 img {
      max-width: 80%;
      max-height: 80%;
      object-fit: contain;
    }

    .flavor-text {
      position: absolute;
      bottom: 200px;
      left: 60px;
      right: 60px;
      text-align: center;
      z-index: 10;
    }

    .flavor-name {
      font-family: var(--font-display, 'Helvetica Neue', Arial, sans-serif);
      font-size: 32px;
      font-weight: 700;
      color: var(--textPrimary, #ffffff);
    }

    .price {
      font-family: var(--font-display, 'Helvetica Neue', Arial, sans-serif);
      font-size: 42px;
      font-weight: 900;
      color: var(--accent, #fde047);
      margin-top: 8px;
    }

    .tagline {
      font-size: 14px;
      color: var(--textSecondary, rgba(255,255,255,0.7));
      margin-top: 6px;
      letter-spacing: 1px;
    }

    .cta-area {
      position: absolute;
      bottom: 60px;
      left: 50%;
      transform: translateX(-50%);
      z-index: 10;
    }

    .cta-button {
      background: var(--accent, #fde047);
      color: var(--onAccent, #000000);
      font-family: var(--font-display, 'Helvetica Neue', Arial, sans-serif);
      font-size: 20px;
      font-weight: 800;
      padding: 18px 56px;
      border-radius: 50px;
      text-transform: uppercase;
      letter-spacing: 3px;
    }
  </style>
</head>
<body>
  <div class="canvas">
    <div class="bg-circle-1"></div>
    <div class="bg-circle-2"></div>
    <div class="bg-circle-3"></div>

    <div class="logo-area" data-visibility="logo">
      <img src="assets/placeholder.png" alt="Brand Logo" data-slot="logo" />
    </div>

    <div class="headline-area">
      <h1 class="headline" data-role="headline" data-importance="primary">TROPICAL FRESH</h1>
      <p class="subheadline" data-role="subheadline" data-importance="secondary">Cold-Pressed Juice</p>
    </div>

    <div class="fruit-orbit-1">
      <img src="assets/placeholder.png" alt="Fruit 1" data-slot="fruit-1" />
    </div>
    <div class="fruit-orbit-2">
      <img src="assets/placeholder.png" alt="Fruit 2" data-slot="fruit-2" />
    </div>
    <div class="fruit-orbit-3">
      <img src="assets/placeholder.png" alt="Fruit 3" data-slot="fruit-3" />
    </div>

    <div class="center-glass">
      <img src="assets/placeholder.png" alt="Glass Bottle" data-slot="glass-bottle" />
    </div>

    <div class="flavor-text">
      <div class="flavor-name" data-role="product-name" data-importance="primary">Mango Passion Blend</div>
      <div class="price" data-role="price" data-importance="primary">$6.99</div>
      <div class="tagline" data-role="supporting" data-importance="tertiary">No Sugar Added | 100% Natural</div>
    </div>

    <div class="cta-area">
      <div class="cta-button" data-role="cta" data-importance="primary">GRAB YOURS</div>
    </div>
  </div>
</body>
</html>
