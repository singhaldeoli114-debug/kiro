<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Fashion Sale Promotion</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }

    .canvas {
      width: 1080px;
      height: 1080px;
      position: relative;
      overflow: hidden;
      background-color: var(--surface, #faf5f0);
      font-family: var(--font-body, 'Helvetica Neue', Arial, sans-serif);
    }

    .model-image {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
    }

    .model-image img {
      width: 100%;
      height: 100%;
      object-fit: cover;
    }

    .diagonal-banner {
      position: absolute;
      top: 80px;
      right: -120px;
      width: 500px;
      height: 100px;
      background-color: var(--accent, #e63946);
      transform: rotate(45deg);
      display: flex;
      align-items: center;
      justify-content: center;
      z-index: 10;
    }

    .banner-text {
      font-family: var(--font-display, 'Helvetica Neue', Arial, sans-serif);
      font-size: 32px;
      font-weight: 900;
      color: var(--onAccent, #ffffff);
      text-transform: uppercase;
      letter-spacing: 3px;
    }

    .scrim-overlay {
      position: absolute;
      bottom: 0;
      left: 0;
      width: 100%;
      height: 50%;
      background: linear-gradient(to top, var(--scrim-strong, rgba(0,0,0,0.85)), transparent);
      z-index: 5;
    }

    .content-area {
      position: absolute;
      bottom: 40px;
      left: 40px;
      right: 40px;
      z-index: 8;
      display: flex;
      flex-direction: column;
      gap: 16px;
    }

    .discount-badge {
      display: inline-block;
      background-color: var(--accent, #e63946);
      color: var(--onAccent, #ffffff);
      font-family: var(--font-display, 'Helvetica Neue', Arial, sans-serif);
      font-size: 72px;
      font-weight: 900;
      padding: 12px 32px;
      align-self: flex-start;
    }

    .headline {
      font-family: var(--font-display, 'Helvetica Neue', Arial, sans-serif);
      font-size: 56px;
      font-weight: 800;
      color: var(--textOverImage, #ffffff);
      text-transform: uppercase;
      line-height: 1.05;
    }

    .subheadline {
      font-family: var(--font-body, 'Helvetica Neue', Arial, sans-serif);
      font-size: 22px;
      font-weight: 400;
      color: var(--textSecondary, #cccccc);
      letter-spacing: 1px;
    }

    .cta-button {
      align-self: flex-start;
      background-color: var(--accent, #e63946);
      color: var(--onAccent, #ffffff);
      font-family: var(--font-display, 'Helvetica Neue', Arial, sans-serif);
      font-size: 18px;
      font-weight: 700;
      padding: 18px 48px;
      border-radius: 0;
      text-transform: uppercase;
      letter-spacing: 3px;
    }

    .logo-area {
      position: absolute;
      top: 40px;
      left: 40px;
      z-index: 10;
    }

    .logo-area img {
      max-height: 50px;
      width: auto;
    }
  </style>
</head>
<body>
  <div class="canvas">
    <div class="model-image">
      <img src="assets/placeholder.png" alt="Fashion Model" data-slot="model-image" />
    </div>

    <div class="scrim-overlay"></div>

    <div class="diagonal-banner">
      <span class="banner-text" data-role="badge" data-importance="primary">50% OFF</span>
    </div>

    <div class="logo-area" data-visibility="logo">
      <img src="assets/placeholder.png" alt="Brand Logo" data-slot="logo" />
    </div>

    <div class="content-area">
      <div class="discount-badge" data-role="discount" data-importance="primary">50%</div>
      <h1 class="headline" data-role="headline" data-importance="primary">FASHION SALE</h1>
      <p class="subheadline" data-role="subheadline" data-importance="secondary">End of Season Collection - Limited Time Only</p>
      <div class="cta-button" data-role="cta" data-importance="primary">SHOP NOW</div>
    </div>
  </div>
</body>
</html>
