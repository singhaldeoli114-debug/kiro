<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Free Shipping</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }

    .canvas {
      width: 1080px;
      height: 1080px;
      position: relative;
      overflow: hidden;
      background-color: var(--surface, #f0f4f8);
      font-family: var(--font-body, 'Helvetica Neue', Arial, sans-serif);
    }

    .bg-pattern {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      background: repeating-linear-gradient(
        45deg,
        transparent,
        transparent 40px,
        var(--surfaceAlt, rgba(0,0,0,0.02)) 40px,
        var(--surfaceAlt, rgba(0,0,0,0.02)) 80px
      );
    }

    .logo-area {
      position: absolute;
      top: 40px;
      left: 40px;
      z-index: 10;
    }

    .logo-area img {
      max-height: 50px;
      width: auto;
    }

    .icon-area {
      position: absolute;
      top: 160px;
      left: 50%;
      transform: translateX(-50%);
      width: 200px;
      height: 200px;
      border-radius: 50%;
      background-color: var(--surfaceAlt, #e8f4fd);
      display: flex;
      align-items: center;
      justify-content: center;
      z-index: 5;
    }

    .icon-area img {
      width: 120px;
      height: 120px;
      object-fit: contain;
    }

    .ribbon-banner {
      position: absolute;
      top: 400px;
      left: -20px;
      right: -20px;
      background-color: var(--accent, #2196f3);
      padding: 24px 60px;
      text-align: center;
      z-index: 8;
    }

    .ribbon-banner::before,
    .ribbon-banner::after {
      content: '';
      position: absolute;
      bottom: -12px;
      width: 0;
      height: 0;
      border-style: solid;
    }

    .ribbon-banner::before {
      left: 0;
      border-width: 12px 12px 0 0;
      border-color: var(--accentAlt, #1565c0) transparent transparent transparent;
    }

    .ribbon-banner::after {
      right: 0;
      border-width: 12px 0 0 12px;
      border-color: var(--accentAlt, #1565c0) transparent transparent transparent;
    }

    .ribbon-text {
      font-family: var(--font-display, 'Helvetica Neue', Arial, sans-serif);
      font-size: 42px;
      font-weight: 900;
      color: var(--onAccent, #ffffff);
      text-transform: uppercase;
      letter-spacing: 6px;
    }

    .content-below {
      position: absolute;
      top: 500px;
      left: 40px;
      right: 40px;
      bottom: 40px;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 24px;
      z-index: 5;
      text-align: center;
    }

    .headline {
      font-family: var(--font-display, 'Helvetica Neue', Arial, sans-serif);
      font-size: 44px;
      font-weight: 800;
      color: var(--textPrimary, #1a1a2e);
      text-transform: uppercase;
      line-height: 1.1;
    }

    .subheadline {
      font-family: var(--font-body, 'Helvetica Neue', Arial, sans-serif);
      font-size: 22px;
      font-weight: 400;
      color: var(--textSecondary, #555555);
    }

    .code-badge {
      background-color: var(--surfaceAlt, #fff3e0);
      border: 2px dashed var(--accent, #2196f3);
      font-family: var(--font-display, 'Helvetica Neue', Arial, sans-serif);
      font-size: 24px;
      font-weight: 700;
      color: var(--accent, #2196f3);
      padding: 14px 32px;
      border-radius: 8px;
      letter-spacing: 3px;
    }

    .validity {
      font-family: var(--font-body, 'Helvetica Neue', Arial, sans-serif);
      font-size: 16px;
      color: var(--textSecondary, #777777);
    }

    .cta-button {
      background-color: var(--accent, #2196f3);
      color: var(--onAccent, #ffffff);
      font-family: var(--font-display, 'Helvetica Neue', Arial, sans-serif);
      font-size: 20px;
      font-weight: 700;
      padding: 18px 56px;
      border-radius: 50px;
      text-transform: uppercase;
      letter-spacing: 3px;
    }
  </style>
</head>
<body>
  <div class="canvas">
    <div class="bg-pattern"></div>

    <div class="logo-area" data-visibility="logo">
      <img src="assets/placeholder.png" alt="Brand Logo" data-slot="logo" />
    </div>

    <div class="icon-area">
      <img src="assets/placeholder.png" alt="Delivery Icon" data-slot="icon-image" />
    </div>

    <div class="ribbon-banner">
      <span class="ribbon-text" data-role="headline" data-importance="primary">FREE SHIPPING</span>
    </div>

    <div class="content-below">
      <h1 class="headline" data-role="headline" data-importance="primary">FREE DELIVERY ON ALL ORDERS</h1>
      <p class="subheadline" data-role="subheadline" data-importance="secondary">No minimum purchase required</p>
      <div class="code-badge" data-role="badge" data-importance="primary">CODE: FREESHIP</div>
      <span class="validity" data-role="supporting" data-importance="tertiary">Valid through December 31</span>
      <div class="cta-button" data-role="cta" data-importance="primary">ORDER NOW</div>
    </div>
  </div>
</body>
</html>
