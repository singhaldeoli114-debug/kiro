<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Business Webinar</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }

    .canvas {
      width: 1080px;
      height: 1080px;
      position: relative;
      overflow: hidden;
      background: var(--surface, #0f172a);
      font-family: var(--font-body, 'Helvetica Neue', Arial, sans-serif);
    }

    .accent-bar {
      position: absolute;
      top: 0;
      left: 0;
      width: 8px;
      height: 100%;
      background: var(--accent, #3b82f6);
    }

    .speaker-area {
      position: absolute;
      top: 180px;
      left: 100px;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 16px;
    }

    .speaker-circle {
      width: 220px;
      height: 220px;
      border-radius: 50%;
      overflow: hidden;
      border: 5px solid var(--accent, #3b82f6);
    }

    .speaker-circle img {
      width: 100%;
      height: 100%;
      object-fit: cover;
    }

    .speaker-name {
      font-family: var(--font-display, 'Helvetica Neue', Arial, sans-serif);
      font-size: 20px;
      font-weight: 600;
      color: var(--textSecondary, #94a3b8);
      text-align: center;
    }

    .content-area {
      position: absolute;
      top: 100px;
      left: 400px;
      right: 80px;
    }

    .event-type {
      font-size: 16px;
      font-weight: 600;
      letter-spacing: 3px;
      text-transform: uppercase;
      color: var(--accent, #3b82f6);
      margin-bottom: 20px;
    }

    .topic-headline {
      font-family: var(--font-display, 'Helvetica Neue', Arial, sans-serif);
      font-size: 42px;
      font-weight: 800;
      color: var(--textPrimary, #ffffff);
      line-height: 1.2;
      margin-bottom: 30px;
    }

    .date-badge {
      display: inline-block;
      background: var(--surfaceAlt, #1e293b);
      border: 1px solid var(--accent, #3b82f6);
      border-radius: 8px;
      padding: 12px 24px;
      font-size: 18px;
      font-weight: 600;
      color: var(--accent, #3b82f6);
      margin-bottom: 30px;
    }

    .learn-list {
      list-style: none;
      margin-bottom: 30px;
    }

    .learn-list li {
      font-size: 18px;
      color: var(--textSecondary, #94a3b8);
      padding: 8px 0;
      padding-left: 24px;
      position: relative;
    }

    .learn-list li::before {
      content: '';
      position: absolute;
      left: 0;
      top: 50%;
      transform: translateY(-50%);
      width: 10px;
      height: 10px;
      background: var(--accent, #3b82f6);
      border-radius: 50%;
    }

    .cta-button {
      position: absolute;
      bottom: 100px;
      left: 400px;
      display: inline-block;
      background: var(--accent, #3b82f6);
      color: var(--onAccent, #ffffff);
      font-family: var(--font-display, 'Helvetica Neue', Arial, sans-serif);
      font-size: 22px;
      font-weight: 700;
      padding: 20px 50px;
      border-radius: 8px;
      text-transform: uppercase;
      letter-spacing: 2px;
    }
  </style>
</head>
<body>
  <div class="canvas">
    <div class="accent-bar"></div>

    <div class="speaker-area">
      <div class="speaker-circle">
        <img src="assets/placeholder.png" alt="Speaker Photo" data-slot="speaker-photo" />
      </div>
      <p class="speaker-name" data-role="speaker-name" data-importance="secondary">Dr. Rebecca Torres</p>
    </div>

    <div class="content-area">
      <p class="event-type" data-role="event-type" data-importance="tertiary">Free Webinar</p>
      <h1 class="topic-headline" data-role="headline" data-importance="primary">Scaling Your Business with AI-Driven Automation</h1>
      <div class="date-badge" data-role="date" data-importance="secondary">March 15, 2024 | 2:00 PM EST</div>

      <ul class="learn-list">
        <li data-role="bullet" data-importance="tertiary">Automate repetitive workflows</li>
        <li data-role="bullet" data-importance="tertiary">Reduce operational costs by 40%</li>
        <li data-role="bullet" data-importance="tertiary">Scale without adding headcount</li>
        <li data-role="bullet" data-importance="tertiary">Live Q&A with industry experts</li>
      </ul>
    </div>

    <span class="cta-button" data-role="cta" data-importance="primary">Register Now</span>
  </div>
</body>
</html>
