<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Healthy Food Promotion</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }

    .canvas {
      width: 1080px;
      height: 1080px;
      position: relative;
      overflow: hidden;
      background-color: var(--surface, #ffffff);
      font-family: var(--font-body, 'Helvetica Neue', Arial, sans-serif);
    }

    .top-bar {
      position: absolute;
      top: 0;
      left: 0;
      right: 0;
      height: 8px;
      background: var(--accent, #22c55e);
    }

    .logo-area {
      position: absolute;
      top: 40px;
      left: 50%;
      transform: translateX(-50%);
      z-index: 10;
    }

    .logo-area img {
      max-height: 45px;
      width: auto;
    }

    .headline-area {
      position: absolute;
      top: 110px;
      left: 60px;
      right: 60px;
      text-align: center;
      z-index: 5;
    }

    .headline {
      font-family: var(--font-display, 'Helvetica Neue', Arial, sans-serif);
      font-size: 56px;
      font-weight: 800;
      color: var(--textPrimary, #1a1a1a);
      line-height: 1.1;
    }

    .headline span {
      color: var(--accent, #22c55e);
    }

    .subheadline {
      font-family: var(--font-body, 'Helvetica Neue', Arial, sans-serif);
      font-size: 20px;
      color: var(--textSecondary, #666666);
      margin-top: 10px;
    }

    .hero-bowl {
      position: absolute;
      top: 250px;
      left: 50%;
      transform: translateX(-50%);
      width: 420px;
      height: 420px;
      border-radius: 50%;
      overflow: hidden;
      background: var(--surfaceAlt, #f0fdf4);
      display: flex;
      align-items: center;
      justify-content: center;
      z-index: 5;
      box-shadow: 0 20px 60px rgba(34, 197, 94, 0.15);
    }

    .hero-bowl img {
      max-width: 90%;
      max-height: 90%;
      object-fit: contain;
    }

    .ingredient-grid {
      position: absolute;
      bottom: 200px;
      left: 60px;
      right: 60px;
      display: grid;
      grid-template-columns: repeat(4, 1fr);
      gap: 16px;
      z-index: 6;
    }

    .ingredient-item {
      background: var(--surfaceAlt, #f0fdf4);
      border-radius: 16px;
      padding: 16px 12px;
      text-align: center;
    }

    .ingredient-item img {
      width: 70px;
      height: 70px;
      object-fit: contain;
      margin-bottom: 8px;
    }

    .ingredient-name {
      font-size: 13px;
      font-weight: 600;
      color: var(--textPrimary, #1a1a1a);
    }

    .calorie-badge {
      font-size: 11px;
      color: var(--accent, #22c55e);
      font-weight: 700;
      margin-top: 4px;
    }

    .benefits-row {
      position: absolute;
      bottom: 120px;
      left: 60px;
      right: 60px;
      display: flex;
      justify-content: center;
      gap: 40px;
      z-index: 5;
    }

    .benefit-item {
      font-size: 14px;
      font-weight: 600;
      color: var(--textSecondary, #666666);
      letter-spacing: 0.5px;
    }

    .benefit-item strong {
      color: var(--accent, #22c55e);
    }

    .cta-area {
      position: absolute;
      bottom: 50px;
      left: 50%;
      transform: translateX(-50%);
      z-index: 10;
    }

    .cta-button {
      background: var(--accent, #22c55e);
      color: var(--onAccent, #ffffff);
      font-family: var(--font-display, 'Helvetica Neue', Arial, sans-serif);
      font-size: 18px;
      font-weight: 700;
      padding: 16px 50px;
      border-radius: 50px;
      text-transform: uppercase;
      letter-spacing: 2px;
    }
  </style>
</head>
<body>
  <div class="canvas">
    <div class="top-bar"></div>

    <div class="logo-area" data-visibility="logo">
      <img src="assets/placeholder.png" alt="Brand Logo" data-slot="logo" />
    </div>

    <div class="headline-area">
      <h1 class="headline" data-role="headline" data-importance="primary">EAT <span>CLEAN</span>, LIVE WELL</h1>
      <p class="subheadline" data-role="subheadline" data-importance="secondary">Fresh Ingredients, Real Nutrition</p>
    </div>

    <div class="hero-bowl">
      <img src="assets/placeholder.png" alt="Salad Bowl" data-slot="hero-bowl" />
    </div>

    <div class="ingredient-grid">
      <div class="ingredient-item">
        <img src="assets/placeholder.png" alt="Ingredient 1" data-slot="ingredient-1" />
        <div class="ingredient-name" data-role="ingredient" data-importance="secondary">Avocado</div>
        <div class="calorie-badge" data-role="supporting" data-importance="tertiary">160 cal</div>
      </div>
      <div class="ingredient-item">
        <img src="assets/placeholder.png" alt="Ingredient 2" data-slot="ingredient-2" />
        <div class="ingredient-name" data-role="ingredient" data-importance="secondary">Quinoa</div>
        <div class="calorie-badge" data-role="supporting" data-importance="tertiary">120 cal</div>
      </div>
      <div class="ingredient-item">
        <img src="assets/placeholder.png" alt="Ingredient 3" data-slot="ingredient-3" />
        <div class="ingredient-name" data-role="ingredient" data-importance="secondary">Kale</div>
        <div class="calorie-badge" data-role="supporting" data-importance="tertiary">33 cal</div>
      </div>
      <div class="ingredient-item">
        <img src="assets/placeholder.png" alt="Ingredient 4" data-slot="ingredient-4" />
        <div class="ingredient-name" data-role="ingredient" data-importance="secondary">Salmon</div>
        <div class="calorie-badge" data-role="supporting" data-importance="tertiary">208 cal</div>
      </div>
    </div>

    <div class="benefits-row">
      <span class="benefit-item" data-role="supporting" data-importance="tertiary"><strong>521</strong> Calories</span>
      <span class="benefit-item" data-role="supporting" data-importance="tertiary"><strong>38g</strong> Protein</span>
      <span class="benefit-item" data-role="supporting" data-importance="tertiary"><strong>12g</strong> Fiber</span>
    </div>

    <div class="cta-area">
      <div class="cta-button" data-role="cta" data-importance="primary">ORDER FRESH</div>
    </div>
  </div>
</body>
</html>
