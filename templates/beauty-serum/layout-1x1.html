<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Beauty Serum</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }

    .canvas {
      width: 1080px;
      height: 1080px;
      position: relative;
      overflow: hidden;
      background: radial-gradient(ellipse at center, var(--surfaceAlt, #2a1f3d), var(--surface, #120b1e));
      font-family: var(--font-body, 'Helvetica Neue', Arial, sans-serif);
    }

    .glow-ring {
      position: absolute;
      top: 50%;
      left: 50%;
      transform: translate(-50%, -55%);
      width: 520px;
      height: 520px;
      border-radius: 50%;
      background: radial-gradient(circle, var(--accent, #c9a0dc) 0%, transparent 70%);
      opacity: 0.4;
    }

    .glow-ring-inner {
      position: absolute;
      top: 50%;
      left: 50%;
      transform: translate(-50%, -55%);
      width: 340px;
      height: 340px;
      border-radius: 50%;
      background: radial-gradient(circle, var(--accent, #c9a0dc) 0%, transparent 60%);
      opacity: 0.6;
    }

    .product-area {
      position: absolute;
      top: 80px;
      left: 50%;
      transform: translateX(-50%);
      width: 400px;
      height: 580px;
      display: flex;
      align-items: center;
      justify-content: center;
      z-index: 5;
    }

    .product-area img {
      width: 100%;
      height: 100%;
      object-fit: contain;
    }

    .brand-name {
      position: absolute;
      top: 50px;
      left: 50%;
      transform: translateX(-50%);
      font-family: var(--font-display, 'Helvetica Neue', Arial, sans-serif);
      font-size: 18px;
      font-weight: 500;
      color: var(--textSecondary, #b8a0cc);
      letter-spacing: 6px;
      text-transform: uppercase;
      z-index: 10;
    }

    .headline {
      position: absolute;
      top: 680px;
      left: 50%;
      transform: translateX(-50%);
      text-align: center;
      font-family: var(--font-display, 'Helvetica Neue', Arial, sans-serif);
      font-size: 48px;
      font-weight: 700;
      color: var(--textPrimary, #ffffff);
      letter-spacing: -1px;
      line-height: 1.1;
      z-index: 10;
    }

    .subheadline {
      position: absolute;
      top: 750px;
      left: 50%;
      transform: translateX(-50%);
      text-align: center;
      font-family: var(--font-body, 'Helvetica Neue', Arial, sans-serif);
      font-size: 20px;
      font-weight: 400;
      color: var(--textSecondary, #b8a0cc);
      z-index: 10;
    }

    .ingredients-row {
      position: absolute;
      bottom: 80px;
      left: 50%;
      transform: translateX(-50%);
      display: flex;
      gap: 16px;
      z-index: 10;
    }

    .ingredient-chip {
      background-color: var(--surfaceAlt, rgba(255, 255, 255, 0.1));
      border: 1px solid var(--accent, rgba(201, 160, 220, 0.4));
      border-radius: 50px;
      padding: 10px 24px;
      font-family: var(--font-body, 'Helvetica Neue', Arial, sans-serif);
      font-size: 14px;
      font-weight: 500;
      color: var(--textPrimary, #ffffff);
      letter-spacing: 1px;
    }

    .logo-area {
      position: absolute;
      bottom: 30px;
      left: 50%;
      transform: translateX(-50%);
      z-index: 10;
    }

    .logo-area img {
      max-height: 40px;
      width: auto;
    }
  </style>
</head>
<body>
  <div class="canvas">
    <div class="glow-ring"></div>
    <div class="glow-ring-inner"></div>

    <p class="brand-name" data-role="brand" data-importance="secondary">LUMINARA BEAUTY</p>

    <div class="product-area">
      <img src="assets/placeholder.png" alt="Serum Bottle" data-slot="hero-product" />
    </div>

    <h1 class="headline" data-role="headline" data-importance="primary">Radiance Serum</h1>
    <p class="subheadline" data-role="subheadline" data-importance="secondary">Reveal your natural glow in 14 days</p>

    <div class="ingredients-row">
      <span class="ingredient-chip" data-role="ingredient" data-importance="tertiary">Hyaluronic Acid</span>
      <span class="ingredient-chip" data-role="ingredient" data-importance="tertiary">Vitamin C</span>
      <span class="ingredient-chip" data-role="ingredient" data-importance="tertiary">Niacinamide</span>
      <span class="ingredient-chip" data-role="ingredient" data-importance="tertiary">Retinol</span>
    </div>

    <div class="logo-area" data-visibility="logo">
      <img src="assets/placeholder.png" alt="Brand Logo" data-slot="logo" />
    </div>
  </div>
</body>
</html>
