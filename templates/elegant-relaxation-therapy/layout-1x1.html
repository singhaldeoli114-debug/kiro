<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Elegant Relaxation Therapy</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }

    .canvas {
      width: 1080px;
      height: 1080px;
      position: relative;
      overflow: hidden;
      background-color: var(--surface, #f5f0f8);
      font-family: var(--font-body, 'Helvetica Neue', Arial, sans-serif);
    }

    .image-section {
      position: absolute;
      top: 0;
      left: 0;
      right: 0;
      height: 420px;
      overflow: hidden;
    }

    .image-section img {
      width: 100%;
      height: 100%;
      object-fit: cover;
    }

    .image-scrim {
      position: absolute;
      top: 0;
      left: 0;
      right: 0;
      height: 420px;
      background: linear-gradient(180deg, var(--scrim-weak, rgba(120, 90, 140, 0.2)) 0%, var(--scrim-strong, rgba(120, 90, 140, 0.6)) 100%);
    }

    .logo-area {
      position: absolute;
      top: 50px;
      left: 50px;
      z-index: 10;
    }

    .logo-area img {
      max-height: 44px;
      width: auto;
    }

    .category-badge {
      position: absolute;
      top: 55px;
      right: 50px;
      font-family: var(--font-body, 'Helvetica Neue', Arial, sans-serif);
      font-size: 11px;
      font-weight: 700;
      color: var(--textOverImage, #ffffff);
      letter-spacing: 4px;
      text-transform: uppercase;
      background-color: var(--accent, rgba(150, 110, 170, 0.5));
      padding: 10px 20px;
      border-radius: 30px;
      z-index: 10;
    }

    .content-section {
      position: absolute;
      top: 420px;
      left: 0;
      right: 0;
      bottom: 0;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: 50px 80px;
    }

    .headline {
      text-align: center;
      font-family: var(--font-display, 'Helvetica Neue', Arial, sans-serif);
      font-size: 52px;
      font-weight: 600;
      color: var(--textPrimary, #3a2d44);
      line-height: 1.15;
      margin-bottom: 20px;
    }

    .subheadline {
      text-align: center;
      font-family: var(--font-body, 'Helvetica Neue', Arial, sans-serif);
      font-size: 18px;
      font-weight: 400;
      color: var(--textSecondary, #7a6b8a);
      line-height: 1.6;
      margin-bottom: 44px;
      max-width: 700px;
    }

    .services-row {
      display: flex;
      align-items: center;
      gap: 16px;
      margin-bottom: 50px;
    }

    .service-pill {
      background-color: var(--surfaceAlt, #ece4f2);
      border-radius: 50px;
      padding: 14px 30px;
      font-family: var(--font-body, 'Helvetica Neue', Arial, sans-serif);
      font-size: 15px;
      font-weight: 500;
      color: var(--textPrimary, #3a2d44);
    }

    .service-separator {
      width: 6px;
      height: 6px;
      border-radius: 50%;
      background-color: var(--accent, #a07cb0);
    }

    .cta-button {
      background-color: var(--accent, #a07cb0);
      color: var(--onAccent, #ffffff);
      font-family: var(--font-display, 'Helvetica Neue', Arial, sans-serif);
      font-size: 15px;
      font-weight: 700;
      padding: 20px 56px;
      border-radius: 50px;
      letter-spacing: 2px;
      text-transform: uppercase;
    }
  </style>
</head>
<body>
  <div class="canvas">
    <div class="image-section">
      <img src="assets/placeholder.png" alt="Spa Atmosphere" data-slot="hero-image" />
    </div>
    <div class="image-scrim"></div>

    <div class="logo-area" data-visibility="logo">
      <img src="assets/placeholder.png" alt="Brand Logo" data-slot="logo" />
    </div>

    <span class="category-badge" data-role="category" data-importance="tertiary">WELLNESS & SPA</span>

    <div class="content-section">
      <h1 class="headline" data-role="headline" data-importance="primary">Find Your Inner Peace</h1>
      <p class="subheadline" data-role="subheadline" data-importance="secondary">Indulge in restorative treatments designed to refresh your body and calm your mind</p>

      <div class="services-row">
        <span class="service-pill" data-role="service" data-importance="primary">Deep Tissue Massage</span>
        <span class="service-separator"></span>
        <span class="service-pill" data-role="service" data-importance="primary">Aromatherapy</span>
        <span class="service-separator"></span>
        <span class="service-pill" data-role="service" data-importance="primary">Hot Stone Therapy</span>
      </div>

      <span class="cta-button" data-role="cta" data-importance="primary">BOOK YOUR SESSION</span>
    </div>
  </div>
</body>
</html>
