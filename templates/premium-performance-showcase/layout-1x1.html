<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Premium Performance Showcase</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }

    .canvas {
      width: 1080px;
      height: 1080px;
      position: relative;
      overflow: hidden;
      background-color: var(--surface, #0a0a0f);
      font-family: var(--font-body, 'Helvetica Neue', Arial, sans-serif);
    }

    .logo-area {
      position: absolute;
      top: 40px;
      left: 40px;
      z-index: 10;
    }

    .logo-area img {
      max-height: 60px;
      width: auto;
    }

    .hero-product {
      position: absolute;
      top: 0;
      right: 0;
      width: 65%;
      height: 100%;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    .hero-product img {
      width: 100%;
      height: 100%;
      object-fit: contain;
    }

    .content-area {
      position: absolute;
      top: 0;
      left: 0;
      width: 50%;
      height: 100%;
      padding: 120px 40px 40px;
      display: flex;
      flex-direction: column;
      justify-content: space-between;
      z-index: 5;
    }

    .text-block {
      display: flex;
      flex-direction: column;
      gap: 16px;
    }

    .headline {
      font-family: var(--font-display, 'Helvetica Neue', Arial, sans-serif);
      font-size: 64px;
      font-weight: 900;
      line-height: 1.0;
      color: var(--textPrimary, #ffffff);
      letter-spacing: -2px;
      text-transform: uppercase;
    }

    .subheadline {
      font-family: var(--font-body, 'Helvetica Neue', Arial, sans-serif);
      font-size: 24px;
      font-weight: 400;
      color: var(--textSecondary, #a0a0b0);
      letter-spacing: 2px;
      text-transform: uppercase;
    }

    .stats-overlay {
      background-color: var(--surfaceAlt, rgba(20, 20, 30, 0.9));
      border-radius: 16px;
      padding: 32px;
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 24px;
    }

    .stat-item {
      text-align: center;
    }

    .stat-value {
      font-family: var(--font-display, 'Helvetica Neue', Arial, sans-serif);
      font-size: 40px;
      font-weight: 800;
      color: var(--accent, #6c5ce7);
      line-height: 1.2;
    }

    .stat-label {
      font-family: var(--font-body, 'Helvetica Neue', Arial, sans-serif);
      font-size: 14px;
      font-weight: 500;
      color: var(--textSecondary, #a0a0b0);
      text-transform: uppercase;
      letter-spacing: 1px;
      margin-top: 4px;
    }

    .cta-button {
      position: absolute;
      bottom: 40px;
      right: 40px;
      background-color: var(--accent, #6c5ce7);
      color: var(--onAccent, #ffffff);
      font-family: var(--font-display, 'Helvetica Neue', Arial, sans-serif);
      font-size: 18px;
      font-weight: 700;
      padding: 16px 40px;
      border-radius: 8px;
      letter-spacing: 2px;
      text-transform: uppercase;
      z-index: 10;
    }
  </style>
</head>
<body>
  <div class="canvas">
    <div class="logo-area" data-visibility="logo">
      <img src="assets/placeholder.png" alt="Brand Logo" data-slot="logo" />
    </div>

    <div class="hero-product">
      <img src="assets/placeholder.png" alt="Hero Product" data-slot="hero-product" />
    </div>

    <div class="content-area">
      <div class="text-block">
        <h1 class="headline" data-role="headline" data-importance="primary">PERFORMANCE REDEFINED</h1>
        <p class="subheadline" data-role="subheadline" data-importance="secondary">Next-Gen Technology</p>
      </div>

      <div class="stats-overlay">
        <div class="stat-item">
          <div class="stat-value" data-role="stat" data-importance="primary">99.8%</div>
          <div class="stat-label" data-role="supporting" data-importance="tertiary">Efficiency Rating</div>
        </div>
        <div class="stat-item">
          <div class="stat-value" data-role="stat" data-importance="primary">4.2x</div>
          <div class="stat-label" data-role="supporting" data-importance="tertiary">Faster Processing</div>
        </div>
        <div class="stat-item">
          <div class="stat-value" data-role="stat" data-importance="primary">50%</div>
          <div class="stat-label" data-role="supporting" data-importance="tertiary">Less Energy</div>
        </div>
      </div>
    </div>

    <div class="cta-button" data-role="cta" data-importance="primary">LEARN MORE</div>
  </div>
</body>
</html>
