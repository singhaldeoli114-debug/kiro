<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Giveaway</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }

    .canvas {
      width: 1080px;
      height: 1080px;
      position: relative;
      overflow: hidden;
      background-color: var(--surface, #4a0e8f);
      font-family: var(--font-body, 'Helvetica Neue', Arial, sans-serif);
    }

    .confetti-dots {
      position: absolute;
      top: 0;
      left: 0;
      right: 0;
      bottom: 0;
    }

    .dot {
      position: absolute;
      border-radius: 50%;
    }

    .dot:nth-child(1) { width: 12px; height: 12px; top: 5%; left: 10%; background-color: var(--accent, #ffd700); }
    .dot:nth-child(2) { width: 8px; height: 8px; top: 8%; right: 15%; background-color: var(--accentAlt, #ff6b6b); }
    .dot:nth-child(3) { width: 15px; height: 15px; top: 15%; left: 85%; background-color: var(--accent, #ffd700); }
    .dot:nth-child(4) { width: 10px; height: 10px; top: 25%; left: 5%; background-color: var(--onAccent, #ffffff); }
    .dot:nth-child(5) { width: 14px; height: 14px; bottom: 30%; right: 8%; background-color: var(--accent, #ffd700); }
    .dot:nth-child(6) { width: 8px; height: 8px; bottom: 15%; left: 12%; background-color: var(--accentAlt, #ff6b6b); }
    .dot:nth-child(7) { width: 11px; height: 11px; top: 40%; right: 5%; background-color: var(--onAccent, #ffffff); opacity: 0.6; }
    .dot:nth-child(8) { width: 9px; height: 9px; bottom: 40%; left: 88%; background-color: var(--accent, #ffd700); opacity: 0.5; }

    .top-section {
      position: absolute;
      top: 40px;
      left: 40px;
      right: 40px;
      text-align: center;
      z-index: 5;
    }

    .giveaway-label {
      font-family: var(--font-display, 'Helvetica Neue', Arial, sans-serif);
      font-size: 24px;
      font-weight: 600;
      color: var(--accent, #ffd700);
      text-transform: uppercase;
      letter-spacing: 8px;
    }

    .headline {
      font-family: var(--font-display, 'Helvetica Neue', Arial, sans-serif);
      font-size: 72px;
      font-weight: 900;
      color: var(--textOverImage, #ffffff);
      text-transform: uppercase;
      line-height: 1.0;
      margin-top: 12px;
    }

    .prize-area {
      position: absolute;
      top: 240px;
      left: 50%;
      transform: translateX(-50%);
      width: 400px;
      height: 360px;
      display: flex;
      align-items: center;
      justify-content: center;
      z-index: 5;
    }

    .prize-circle {
      width: 340px;
      height: 340px;
      border-radius: 50%;
      border: 4px solid var(--accent, #ffd700);
      display: flex;
      align-items: center;
      justify-content: center;
      background-color: var(--surfaceAlt, rgba(255,255,255,0.1));
    }

    .prize-circle img {
      max-width: 80%;
      max-height: 80%;
      object-fit: contain;
    }

    .steps-section {
      position: absolute;
      bottom: 180px;
      left: 60px;
      right: 60px;
      display: flex;
      justify-content: center;
      gap: 60px;
      z-index: 5;
    }

    .step {
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 10px;
    }

    .step-number {
      width: 56px;
      height: 56px;
      border-radius: 50%;
      background-color: var(--accent, #ffd700);
      color: var(--surface, #4a0e8f);
      font-family: var(--font-display, 'Helvetica Neue', Arial, sans-serif);
      font-size: 28px;
      font-weight: 900;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    .step-text {
      font-family: var(--font-body, 'Helvetica Neue', Arial, sans-serif);
      font-size: 18px;
      font-weight: 600;
      color: var(--textOverImage, #ffffff);
      text-align: center;
      max-width: 180px;
    }

    .bottom-section {
      position: absolute;
      bottom: 50px;
      left: 40px;
      right: 40px;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 12px;
      z-index: 5;
    }

    .cta-button {
      background-color: var(--accent, #ffd700);
      color: var(--surface, #4a0e8f);
      font-family: var(--font-display, 'Helvetica Neue', Arial, sans-serif);
      font-size: 20px;
      font-weight: 800;
      padding: 18px 56px;
      border-radius: 50px;
      text-transform: uppercase;
      letter-spacing: 3px;
    }

    .terms {
      font-family: var(--font-body, 'Helvetica Neue', Arial, sans-serif);
      font-size: 13px;
      color: var(--textSecondary, rgba(255,255,255,0.5));
    }

    .logo-area {
      position: absolute;
      top: 40px;
      right: 40px;
      z-index: 10;
    }

    .logo-area img {
      max-height: 50px;
      width: auto;
    }
  </style>
</head>
<body>
  <div class="canvas">
    <div class="confetti-dots">
      <div class="dot"></div>
      <div class="dot"></div>
      <div class="dot"></div>
      <div class="dot"></div>
      <div class="dot"></div>
      <div class="dot"></div>
      <div class="dot"></div>
      <div class="dot"></div>
    </div>

    <div class="logo-area" data-visibility="logo">
      <img src="assets/placeholder.png" alt="Brand Logo" data-slot="logo" />
    </div>

    <div class="top-section">
      <span class="giveaway-label" data-role="badge" data-importance="secondary">GIVEAWAY</span>
      <h1 class="headline" data-role="headline" data-importance="primary">WIN THIS PRIZE</h1>
    </div>

    <div class="prize-area">
      <div class="prize-circle">
        <img src="assets/placeholder.png" alt="Prize Item" data-slot="prize-image" />
      </div>
    </div>

    <div class="steps-section">
      <div class="step">
        <div class="step-number" data-role="supporting" data-importance="primary">1</div>
        <span class="step-text" data-role="supporting" data-importance="secondary">Follow our page</span>
      </div>
      <div class="step">
        <div class="step-number" data-role="supporting" data-importance="primary">2</div>
        <span class="step-text" data-role="supporting" data-importance="secondary">Like this post</span>
      </div>
      <div class="step">
        <div class="step-number" data-role="supporting" data-importance="primary">3</div>
        <span class="step-text" data-role="supporting" data-importance="secondary">Tag 2 friends</span>
      </div>
    </div>

    <div class="bottom-section">
      <div class="cta-button" data-role="cta" data-importance="primary">ENTER NOW</div>
      <span class="terms" data-role="supporting" data-importance="tertiary">Ends Dec 31 | Winner announced Jan 5</span>
    </div>
  </div>
</body>
</html>
