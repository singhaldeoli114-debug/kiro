<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Shoes Collection</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }

    .canvas {
      width: 1080px;
      height: 1080px;
      position: relative;
      overflow: hidden;
      background-color: var(--surface, #1a1a1a);
      font-family: var(--font-body, 'Helvetica Neue', Arial, sans-serif);
    }

    .accent-bg {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      background: linear-gradient(135deg, var(--accent, #ff4d4d) 0%, var(--accentAlt, #cc0000) 100%);
    }

    .diagonal-line {
      position: absolute;
      top: -200px;
      left: 200px;
      width: 3px;
      height: 1400px;
      background-color: var(--onAccent, #ffffff);
      opacity: 0.15;
      transform: rotate(25deg);
    }

    .diagonal-line-2 {
      position: absolute;
      top: -200px;
      left: 650px;
      width: 3px;
      height: 1400px;
      background-color: var(--onAccent, #ffffff);
      opacity: 0.1;
      transform: rotate(25deg);
    }

    .logo-area {
      position: absolute;
      top: 40px;
      left: 40px;
      z-index: 10;
    }

    .logo-area img {
      max-height: 50px;
      width: auto;
    }

    .brand-tag {
      position: absolute;
      top: 50px;
      right: 50px;
      font-family: var(--font-body, 'Helvetica Neue', Arial, sans-serif);
      font-size: 13px;
      font-weight: 600;
      color: var(--onAccent, #ffffff);
      letter-spacing: 4px;
      text-transform: uppercase;
      z-index: 5;
      opacity: 0.9;
    }

    .big-headline {
      position: absolute;
      bottom: 140px;
      left: 50px;
      font-family: var(--font-display, 'Helvetica Neue', Arial, sans-serif);
      font-size: 180px;
      font-weight: 900;
      line-height: 0.85;
      color: var(--onAccent, #ffffff);
      text-transform: uppercase;
      opacity: 0.2;
      z-index: 2;
    }

    .shoe-container {
      position: absolute;
      top: 50%;
      left: 50%;
      transform: translate(-40%, -50%) rotate(-15deg);
      width: 700px;
      height: 500px;
      z-index: 5;
    }

    .shoe-container img {
      width: 100%;
      height: 100%;
      object-fit: contain;
    }

    .price-badge {
      position: absolute;
      top: 120px;
      right: 50px;
      background-color: var(--surface, #1a1a1a);
      color: var(--textPrimary, #ffffff);
      font-family: var(--font-display, 'Helvetica Neue', Arial, sans-serif);
      font-size: 36px;
      font-weight: 800;
      padding: 16px 28px;
      border-radius: 4px;
      z-index: 10;
    }

    .bottom-bar {
      position: absolute;
      bottom: 40px;
      left: 50px;
      right: 50px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      z-index: 10;
    }

    .tagline {
      font-family: var(--font-body, 'Helvetica Neue', Arial, sans-serif);
      font-size: 18px;
      font-weight: 400;
      color: var(--onAccent, #ffffff);
      letter-spacing: 1px;
    }

    .cta-button {
      background-color: var(--surface, #1a1a1a);
      color: var(--textPrimary, #ffffff);
      font-family: var(--font-display, 'Helvetica Neue', Arial, sans-serif);
      font-size: 14px;
      font-weight: 700;
      padding: 16px 32px;
      letter-spacing: 3px;
      text-transform: uppercase;
      border-radius: 4px;
    }
  </style>
</head>
<body>
  <div class="canvas">
    <div class="accent-bg"></div>
    <div class="diagonal-line"></div>
    <div class="diagonal-line-2"></div>

    <div class="logo-area" data-visibility="logo">
      <img src="assets/placeholder.png" alt="Brand Logo" data-slot="logo" />
    </div>

    <span class="brand-tag" data-role="tagline" data-importance="tertiary">LIMITED EDITION</span>

    <div class="big-headline" data-role="headline" data-importance="primary">AIR MAX</div>

    <div class="shoe-container">
      <img src="assets/placeholder.png" alt="Shoe Product" data-slot="shoe" />
    </div>

    <div class="price-badge" data-role="price" data-importance="primary">$189</div>

    <div class="bottom-bar">
      <span class="tagline" data-role="subtitle" data-importance="secondary">Built for speed. Designed for style.</span>
      <div class="cta-button" data-role="cta" data-importance="primary">BUY NOW</div>
    </div>
  </div>
</body>
</html>
