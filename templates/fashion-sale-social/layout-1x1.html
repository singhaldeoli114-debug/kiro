<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Fashion Sale Social</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }

    .canvas {
      width: 1080px;
      height: 1080px;
      position: relative;
      overflow: hidden;
      background-color: var(--surface, #1a1a1a);
      font-family: var(--font-body, 'Helvetica Neue', Arial, sans-serif);
    }

    .model-image {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
    }

    .model-image img {
      width: 100%;
      height: 100%;
      object-fit: cover;
    }

    .gradient-scrim {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      background: linear-gradient(
        135deg,
        var(--scrim-strong, rgba(0,0,0,0.7)) 0%,
        transparent 50%,
        var(--scrim-weak, rgba(0,0,0,0.3)) 100%
      );
      z-index: 3;
    }

    .discount-overlay {
      position: absolute;
      top: 80px;
      right: 80px;
      z-index: 8;
      text-align: center;
    }

    .discount-value {
      font-family: var(--font-display, 'Helvetica Neue', Arial, sans-serif);
      font-size: 120px;
      font-weight: 900;
      color: var(--accent, #e63946);
      line-height: 0.9;
    }

    .discount-label {
      font-family: var(--font-display, 'Helvetica Neue', Arial, sans-serif);
      font-size: 36px;
      font-weight: 700;
      color: var(--accent, #e63946);
      text-transform: uppercase;
      letter-spacing: 8px;
    }

    .content-left {
      position: absolute;
      top: 80px;
      left: 60px;
      bottom: 80px;
      width: 50%;
      z-index: 8;
      display: flex;
      flex-direction: column;
      justify-content: space-between;
    }

    .top-content {
      display: flex;
      flex-direction: column;
      gap: 12px;
    }

    .badge {
      display: inline-block;
      border: 2px solid var(--accent, #e63946);
      color: var(--accent, #e63946);
      font-family: var(--font-display, 'Helvetica Neue', Arial, sans-serif);
      font-size: 14px;
      font-weight: 700;
      padding: 8px 16px;
      text-transform: uppercase;
      letter-spacing: 3px;
      align-self: flex-start;
    }

    .headline {
      font-family: var(--font-display, 'Helvetica Neue', Arial, sans-serif);
      font-size: 64px;
      font-weight: 900;
      color: var(--textOverImage, #ffffff);
      text-transform: uppercase;
      line-height: 1.0;
      letter-spacing: -1px;
    }

    .subheadline {
      font-family: var(--font-body, 'Helvetica Neue', Arial, sans-serif);
      font-size: 20px;
      color: var(--textSecondary, #cccccc);
      line-height: 1.4;
    }

    .bottom-content {
      display: flex;
      flex-direction: column;
      gap: 20px;
    }

    .cta-button {
      align-self: flex-start;
      background-color: var(--accent, #e63946);
      color: var(--onAccent, #ffffff);
      font-family: var(--font-display, 'Helvetica Neue', Arial, sans-serif);
      font-size: 16px;
      font-weight: 700;
      padding: 18px 44px;
      text-transform: uppercase;
      letter-spacing: 3px;
    }

    .terms {
      font-family: var(--font-body, 'Helvetica Neue', Arial, sans-serif);
      font-size: 13px;
      color: var(--textSecondary, #888888);
    }

    .logo-area {
      position: absolute;
      bottom: 60px;
      right: 60px;
      z-index: 10;
    }

    .logo-area img {
      max-height: 40px;
      width: auto;
    }
  </style>
</head>
<body>
  <div class="canvas">
    <div class="model-image">
      <img src="assets/placeholder.png" alt="Fashion Model" data-slot="model-image" />
    </div>

    <div class="gradient-scrim"></div>

    <div class="discount-overlay">
      <div class="discount-value" data-role="discount" data-importance="primary">60%</div>
      <div class="discount-label" data-role="badge" data-importance="secondary">OFF</div>
    </div>

    <div class="content-left">
      <div class="top-content">
        <span class="badge" data-role="badge" data-importance="tertiary">LIMITED TIME</span>
        <h1 class="headline" data-role="headline" data-importance="primary">SEASON SALE</h1>
        <p class="subheadline" data-role="subheadline" data-importance="secondary">New arrivals and bestsellers at unbeatable prices this season</p>
      </div>

      <div class="bottom-content">
        <div class="cta-button" data-role="cta" data-importance="primary">SHOP COLLECTION</div>
        <span class="terms" data-role="supporting" data-importance="tertiary">*Terms and conditions apply</span>
      </div>
    </div>

    <div class="logo-area" data-visibility="logo">
      <img src="assets/placeholder.png" alt="Brand Logo" data-slot="logo" />
    </div>
  </div>
</body>
</html>
