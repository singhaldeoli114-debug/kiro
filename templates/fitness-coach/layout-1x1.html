<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Fitness Coach</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }

    .canvas {
      width: 1080px;
      height: 1080px;
      position: relative;
      overflow: hidden;
      background-color: var(--surface, #111111);
      font-family: var(--font-body, 'Helvetica Neue', Arial, sans-serif);
    }

    .photo-section {
      position: absolute;
      top: 0;
      left: 0;
      right: 0;
      height: 648px;
      overflow: hidden;
    }

    .photo-section img {
      width: 100%;
      height: 100%;
      object-fit: cover;
    }

    .photo-scrim {
      position: absolute;
      top: 0;
      left: 0;
      right: 0;
      height: 648px;
      background: linear-gradient(180deg, var(--scrim-strong, rgba(0, 0, 0, 0.5)) 0%, transparent 50%, var(--scrim-strong, rgba(0, 0, 0, 0.7)) 100%);
    }

    .logo-area {
      position: absolute;
      top: 40px;
      left: 50px;
      z-index: 10;
    }

    .logo-area img {
      max-height: 44px;
      width: auto;
    }

    .headline {
      position: absolute;
      top: 100px;
      left: 50px;
      right: 160px;
      font-family: var(--font-display, 'Helvetica Neue', Arial, sans-serif);
      font-size: 72px;
      font-weight: 900;
      color: var(--textOverImage, #ffffff);
      line-height: 0.95;
      text-transform: uppercase;
      letter-spacing: -2px;
      z-index: 10;
    }

    .accent-bar-top {
      position: absolute;
      top: 95px;
      right: 50px;
      width: 80px;
      height: 6px;
      background-color: var(--accent, #ff4d4d);
      z-index: 10;
    }

    .info-section {
      position: absolute;
      bottom: 0;
      left: 0;
      right: 0;
      height: 432px;
      background-color: var(--surfaceAlt, #1a1a1a);
      padding: 50px;
      display: flex;
      flex-direction: column;
    }

    .coach-info {
      margin-bottom: 36px;
    }

    .coach-name {
      font-family: var(--font-display, 'Helvetica Neue', Arial, sans-serif);
      font-size: 28px;
      font-weight: 800;
      color: var(--textPrimary, #ffffff);
      letter-spacing: 2px;
      text-transform: uppercase;
      margin-bottom: 8px;
    }

    .coach-title {
      font-family: var(--font-body, 'Helvetica Neue', Arial, sans-serif);
      font-size: 16px;
      font-weight: 400;
      color: var(--textSecondary, #999999);
    }

    .services-grid {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 20px;
      margin-bottom: 40px;
      flex: 1;
    }

    .service-item {
      display: flex;
      align-items: center;
      gap: 16px;
    }

    .service-bar {
      width: 4px;
      height: 36px;
      background-color: var(--accent, #ff4d4d);
      border-radius: 2px;
    }

    .service-text {
      font-family: var(--font-body, 'Helvetica Neue', Arial, sans-serif);
      font-size: 16px;
      font-weight: 600;
      color: var(--textPrimary, #ffffff);
      text-transform: uppercase;
      letter-spacing: 1px;
    }

    .cta-row {
      display: flex;
      justify-content: flex-end;
    }

    .cta-button {
      background-color: var(--accent, #ff4d4d);
      color: var(--onAccent, #ffffff);
      font-family: var(--font-display, 'Helvetica Neue', Arial, sans-serif);
      font-size: 16px;
      font-weight: 800;
      padding: 20px 48px;
      letter-spacing: 2px;
      text-transform: uppercase;
    }
  </style>
</head>
<body>
  <div class="canvas">
    <div class="photo-section">
      <img src="assets/placeholder.png" alt="Fitness Coach" data-slot="trainer-photo" />
    </div>
    <div class="photo-scrim"></div>

    <div class="logo-area" data-visibility="logo">
      <img src="assets/placeholder.png" alt="Brand Logo" data-slot="logo" />
    </div>

    <div class="accent-bar-top"></div>
    <h1 class="headline" data-role="headline" data-importance="primary">TRANSFORM YOUR BODY</h1>

    <div class="info-section">
      <div class="coach-info">
        <h2 class="coach-name" data-role="name" data-importance="primary">COACH MARCUS TAYLOR</h2>
        <p class="coach-title" data-role="title" data-importance="secondary">Certified Strength & Conditioning Specialist</p>
      </div>

      <div class="services-grid">
        <div class="service-item">
          <div class="service-bar"></div>
          <span class="service-text" data-role="service" data-importance="tertiary">Strength Training</span>
        </div>
        <div class="service-item">
          <div class="service-bar"></div>
          <span class="service-text" data-role="service" data-importance="tertiary">HIIT Workouts</span>
        </div>
        <div class="service-item">
          <div class="service-bar"></div>
          <span class="service-text" data-role="service" data-importance="tertiary">Nutrition Planning</span>
        </div>
        <div class="service-item">
          <div class="service-bar"></div>
          <span class="service-text" data-role="service" data-importance="tertiary">Body Transformation</span>
        </div>
      </div>

      <div class="cta-row">
        <span class="cta-button" data-role="cta" data-importance="primary">START FREE TRIAL</span>
      </div>
    </div>
  </div>
</body>
</html>
