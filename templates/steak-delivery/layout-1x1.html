<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Steak Delivery</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }

    .canvas {
      width: 1080px;
      height: 1080px;
      position: relative;
      overflow: hidden;
      background-color: var(--surface, #1a1a1a);
      font-family: var(--font-body, 'Helvetica Neue', Arial, sans-serif);
    }

    .grill-lines {
      position: absolute;
      top: 0;
      left: 0;
      right: 0;
      bottom: 0;
      background: repeating-linear-gradient(
        0deg,
        transparent,
        transparent 22px,
        var(--surfaceAlt, rgba(255,255,255,0.03)) 22px,
        var(--surfaceAlt, rgba(255,255,255,0.03)) 24px
      );
      z-index: 1;
    }

    .fire-gradient {
      position: absolute;
      bottom: 0;
      left: 0;
      right: 0;
      height: 200px;
      background: linear-gradient(to top, var(--accent, #dc2626) 0%, transparent 100%);
      opacity: 0.08;
      z-index: 2;
    }

    .logo-area {
      position: absolute;
      top: 40px;
      left: 50%;
      transform: translateX(-50%);
      z-index: 10;
    }

    .logo-area img {
      max-height: 45px;
      width: auto;
    }

    .steak-area {
      position: absolute;
      top: 80px;
      left: 50%;
      transform: translateX(-50%);
      width: 900px;
      height: 480px;
      overflow: hidden;
      border-radius: 12px;
      z-index: 5;
    }

    .steak-area img {
      width: 100%;
      height: 100%;
      object-fit: cover;
    }

    .steak-scrim {
      position: absolute;
      top: 80px;
      left: 50%;
      transform: translateX(-50%);
      width: 900px;
      height: 480px;
      border-radius: 12px;
      background: linear-gradient(to top, var(--scrim-strong, rgba(0,0,0,0.7)) 0%, transparent 50%);
      z-index: 6;
    }

    .delivery-badge {
      position: absolute;
      top: 530px;
      right: 120px;
      display: flex;
      align-items: center;
      gap: 12px;
      background: var(--accent, #dc2626);
      padding: 12px 24px;
      border-radius: 30px;
      z-index: 10;
    }

    .delivery-icon-area {
      width: 36px;
      height: 36px;
      border-radius: 50%;
      background: var(--onAccent, #ffffff);
      display: flex;
      align-items: center;
      justify-content: center;
      overflow: hidden;
    }

    .delivery-icon-area img {
      width: 24px;
      height: 24px;
      object-fit: contain;
    }

    .delivery-text {
      font-family: var(--font-display, 'Helvetica Neue', Arial, sans-serif);
      font-size: 14px;
      font-weight: 700;
      color: var(--onAccent, #ffffff);
      text-transform: uppercase;
      letter-spacing: 2px;
    }

    .content-area {
      position: absolute;
      bottom: 180px;
      left: 80px;
      right: 80px;
      z-index: 10;
    }

    .headline {
      font-family: var(--font-display, 'Helvetica Neue', Arial, sans-serif);
      font-size: 64px;
      font-weight: 900;
      color: var(--textPrimary, #ffffff);
      text-transform: uppercase;
      line-height: 1;
    }

    .subheadline {
      font-family: var(--font-body, 'Helvetica Neue', Arial, sans-serif);
      font-size: 20px;
      color: var(--textSecondary, #bbbbbb);
      margin-top: 10px;
    }

    .price-row {
      display: flex;
      align-items: baseline;
      gap: 16px;
      margin-top: 20px;
    }

    .price {
      font-family: var(--font-display, 'Helvetica Neue', Arial, sans-serif);
      font-size: 48px;
      font-weight: 900;
      color: var(--accent, #dc2626);
    }

    .price-note {
      font-size: 16px;
      color: var(--textSecondary, #999999);
    }

    .cta-area {
      position: absolute;
      bottom: 60px;
      left: 80px;
      right: 80px;
      z-index: 10;
    }

    .cta-button {
      background: var(--accent, #dc2626);
      color: var(--onAccent, #ffffff);
      font-family: var(--font-display, 'Helvetica Neue', Arial, sans-serif);
      font-size: 24px;
      font-weight: 900;
      padding: 24px;
      text-align: center;
      text-transform: uppercase;
      letter-spacing: 6px;
      border-radius: 8px;
      width: 100%;
      display: block;
    }
  </style>
</head>
<body>
  <div class="canvas">
    <div class="grill-lines"></div>
    <div class="fire-gradient"></div>

    <div class="logo-area" data-visibility="logo">
      <img src="assets/placeholder.png" alt="Brand Logo" data-slot="logo" />
    </div>

    <div class="steak-area">
      <img src="assets/placeholder.png" alt="Steak" data-slot="steak-image" />
    </div>
    <div class="steak-scrim"></div>

    <div class="delivery-badge">
      <div class="delivery-icon-area">
        <img src="assets/placeholder.png" alt="Delivery Icon" data-slot="delivery-icon" />
      </div>
      <span class="delivery-text" data-role="badge" data-importance="secondary">Express Delivery</span>
    </div>

    <div class="content-area">
      <h1 class="headline" data-role="headline" data-importance="primary">PRIME RIBEYE</h1>
      <p class="subheadline" data-role="subheadline" data-importance="secondary">28-Day Dry Aged, Flame Grilled</p>
      <div class="price-row">
        <span class="price" data-role="price" data-importance="primary">$34.99</span>
        <span class="price-note" data-role="supporting" data-importance="tertiary">Free delivery over $50</span>
      </div>
    </div>

    <div class="cta-area">
      <div class="cta-button" data-role="cta" data-importance="primary">ORDER NOW</div>
    </div>
  </div>
</body>
</html>
