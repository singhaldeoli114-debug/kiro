<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Speaker</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }

    .canvas {
      width: 1080px;
      height: 1080px;
      position: relative;
      overflow: hidden;
      background-color: var(--surface, #f8f8fa);
      font-family: var(--font-body, 'Helvetica Neue', Arial, sans-serif);
    }

    .left-panel {
      position: absolute;
      top: 0;
      left: 0;
      width: 50%;
      height: 100%;
      background-color: var(--surfaceAlt, #eeeef2);
      display: flex;
      align-items: center;
      justify-content: center;
    }

    .product-image {
      width: 380px;
      height: 520px;
    }

    .product-image img {
      width: 100%;
      height: 100%;
      object-fit: contain;
    }

    .right-panel {
      position: absolute;
      top: 0;
      right: 0;
      width: 50%;
      height: 100%;
      padding: 50px;
      display: flex;
      flex-direction: column;
      justify-content: center;
    }

    .logo-area {
      position: absolute;
      top: 40px;
      left: 50px;
      z-index: 10;
    }

    .logo-area img {
      max-height: 45px;
      width: auto;
    }

    .category-tag {
      font-family: var(--font-body, 'Helvetica Neue', Arial, sans-serif);
      font-size: 12px;
      font-weight: 600;
      color: var(--accent, #4a90d9);
      letter-spacing: 4px;
      text-transform: uppercase;
      margin-bottom: 12px;
    }

    .headline {
      font-family: var(--font-display, 'Helvetica Neue', Arial, sans-serif);
      font-size: 48px;
      font-weight: 800;
      color: var(--textPrimary, #1a1a1a);
      line-height: 1.1;
      margin-bottom: 12px;
    }

    .subtitle {
      font-family: var(--font-body, 'Helvetica Neue', Arial, sans-serif);
      font-size: 16px;
      font-weight: 400;
      color: var(--textSecondary, #666666);
      line-height: 1.5;
      margin-bottom: 32px;
    }

    .divider {
      width: 50px;
      height: 3px;
      background-color: var(--accent, #4a90d9);
      margin-bottom: 32px;
    }

    .features-list {
      display: flex;
      flex-direction: column;
      gap: 16px;
      margin-bottom: 40px;
    }

    .feature-item {
      display: flex;
      align-items: center;
      gap: 12px;
    }

    .feature-dot {
      width: 8px;
      height: 8px;
      border-radius: 50%;
      background-color: var(--accent, #4a90d9);
      flex-shrink: 0;
    }

    .feature-text {
      font-family: var(--font-body, 'Helvetica Neue', Arial, sans-serif);
      font-size: 17px;
      font-weight: 500;
      color: var(--textPrimary, #1a1a1a);
    }

    .bottom-row {
      display: flex;
      align-items: center;
      gap: 24px;
    }

    .price {
      font-family: var(--font-display, 'Helvetica Neue', Arial, sans-serif);
      font-size: 36px;
      font-weight: 800;
      color: var(--textPrimary, #1a1a1a);
    }

    .cta-button {
      background-color: var(--accent, #4a90d9);
      color: var(--onAccent, #ffffff);
      font-family: var(--font-display, 'Helvetica Neue', Arial, sans-serif);
      font-size: 13px;
      font-weight: 700;
      padding: 14px 28px;
      letter-spacing: 2px;
      text-transform: uppercase;
      border-radius: 4px;
    }
  </style>
</head>
<body>
  <div class="canvas">
    <div class="logo-area" data-visibility="logo">
      <img src="assets/placeholder.png" alt="Brand Logo" data-slot="logo" />
    </div>

    <div class="left-panel">
      <div class="product-image">
        <img src="assets/placeholder.png" alt="Speaker Product" data-slot="product" />
      </div>
    </div>

    <div class="right-panel">
      <p class="category-tag" data-role="tagline" data-importance="tertiary">SMART SPEAKER</p>
      <h1 class="headline" data-role="headline" data-importance="primary">ECHO<br>STUDIO</h1>
      <p class="subtitle" data-role="subtitle" data-importance="secondary">Immersive sound meets intelligent design</p>
      <div class="divider"></div>
      <div class="features-list">
        <div class="feature-item">
          <div class="feature-dot"></div>
          <span class="feature-text" data-role="feature" data-importance="secondary">360° Spatial Audio</span>
        </div>
        <div class="feature-item">
          <div class="feature-dot"></div>
          <span class="feature-text" data-role="feature" data-importance="secondary">Hi-Res Lossless</span>
        </div>
        <div class="feature-item">
          <div class="feature-dot"></div>
          <span class="feature-text" data-role="feature" data-importance="secondary">Smart Home Hub</span>
        </div>
        <div class="feature-item">
          <div class="feature-dot"></div>
          <span class="feature-text" data-role="feature" data-importance="secondary">Voice Control AI</span>
        </div>
      </div>
      <div class="bottom-row">
        <span class="price" data-role="price" data-importance="primary">$199</span>
        <div class="cta-button" data-role="cta" data-importance="primary">ADD TO CART</div>
      </div>
    </div>
  </div>
</body>
</html>
