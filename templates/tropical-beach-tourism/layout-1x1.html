<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Tropical Beach Tourism</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }

    .canvas {
      width: 1080px;
      height: 1080px;
      position: relative;
      overflow: hidden;
      background: var(--surface, #000000);
      font-family: var(--font-body, 'Helvetica Neue', Arial, sans-serif);
    }

    .background-photo {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      z-index: 1;
    }

    .background-photo img {
      width: 100%;
      height: 100%;
      object-fit: cover;
    }

    .scrim-overlay {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      background: linear-gradient(
        to bottom,
        var(--scrim-weak, rgba(0, 0, 0, 0)) 0%,
        var(--scrim-weak, rgba(0, 0, 0, 0)) 40%,
        var(--scrim-strong, rgba(0, 0, 0, 0.7)) 100%
      );
      z-index: 2;
    }

    .text-overlay {
      position: absolute;
      bottom: 80px;
      left: 80px;
      right: 80px;
      z-index: 5;
    }

    .tagline {
      font-size: 18px;
      font-weight: 400;
      letter-spacing: 4px;
      text-transform: uppercase;
      color: var(--textOverImage, rgba(255, 255, 255, 0.8));
      margin-bottom: 16px;
    }

    .destination {
      font-family: var(--font-display, 'Helvetica Neue', Arial, sans-serif);
      font-size: 72px;
      font-weight: 300;
      color: var(--textOverImage, #ffffff);
      line-height: 1.1;
      margin-bottom: 20px;
      letter-spacing: -1px;
    }

    .price {
      font-size: 28px;
      font-weight: 600;
      color: var(--textOverImage, #ffffff);
      margin-bottom: 10px;
    }

    .dates {
      font-size: 18px;
      font-weight: 400;
      color: var(--textOverImage, rgba(255, 255, 255, 0.7));
    }
  </style>
</head>
<body>
  <div class="canvas">
    <div class="background-photo">
      <img src="assets/placeholder.png" alt="Beach Destination" data-slot="background" />
    </div>

    <div class="scrim-overlay"></div>

    <div class="text-overlay">
      <p class="tagline" data-role="tagline" data-importance="tertiary">Escape to Paradise</p>
      <h1 class="destination" data-role="destination" data-importance="primary">Bali, Indonesia</h1>
      <p class="price" data-role="price" data-importance="secondary">From $1,299 per person</p>
      <p class="dates" data-role="dates" data-importance="tertiary">7 nights | All-inclusive</p>
    </div>
  </div>
</body>
</html>
