<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Minimal Editorial Fashion</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }

    .canvas {
      width: 1080px;
      height: 1080px;
      position: relative;
      overflow: hidden;
      background-color: var(--surface, #ffffff);
      font-family: var(--font-body, 'Helvetica Neue', Arial, sans-serif);
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
    }

    .logo-area {
      position: absolute;
      top: 50px;
      left: 50%;
      transform: translateX(-50%);
      z-index: 10;
    }

    .logo-area img {
      max-height: 40px;
      width: auto;
    }

    .model-frame {
      width: 560px;
      height: 700px;
      position: relative;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    .model-frame img {
      width: 100%;
      height: 100%;
      object-fit: cover;
    }

    .text-top {
      position: absolute;
      top: 130px;
      left: 50%;
      transform: translateX(-50%);
      text-align: center;
      z-index: 5;
    }

    .category-label {
      font-family: var(--font-body, 'Helvetica Neue', Arial, sans-serif);
      font-size: 13px;
      font-weight: 500;
      color: var(--textSecondary, #888888);
      letter-spacing: 6px;
      text-transform: uppercase;
    }

    .text-center {
      position: absolute;
      top: 50%;
      left: 50%;
      transform: translate(-50%, -50%);
      text-align: center;
      z-index: 10;
      width: 100%;
    }

    .headline {
      font-family: var(--font-display, 'Helvetica Neue', Arial, sans-serif);
      font-size: 120px;
      font-weight: 100;
      line-height: 1.0;
      color: var(--textOverImage, #ffffff);
      text-transform: uppercase;
      letter-spacing: -2px;
      mix-blend-mode: difference;
    }

    .text-bottom {
      position: absolute;
      bottom: 80px;
      left: 50%;
      transform: translateX(-50%);
      text-align: center;
      z-index: 5;
    }

    .subtitle {
      font-family: var(--font-body, 'Helvetica Neue', Arial, sans-serif);
      font-size: 16px;
      font-weight: 400;
      color: var(--textSecondary, #888888);
      letter-spacing: 2px;
      margin-bottom: 24px;
    }

    .cta-link {
      font-family: var(--font-body, 'Helvetica Neue', Arial, sans-serif);
      font-size: 14px;
      font-weight: 600;
      color: var(--textPrimary, #1a1a1a);
      text-decoration: none;
      letter-spacing: 3px;
      text-transform: uppercase;
      border-bottom: 2px solid var(--accent, #1a1a1a);
      padding-bottom: 4px;
    }
  </style>
</head>
<body>
  <div class="canvas">
    <div class="logo-area" data-visibility="logo">
      <img src="assets/placeholder.png" alt="Brand Logo" data-slot="logo" />
    </div>

    <div class="text-top">
      <p class="category-label" data-role="tagline" data-importance="tertiary">RESORT COLLECTION</p>
    </div>

    <div class="model-frame">
      <img src="assets/placeholder.png" alt="Fashion Editorial" data-slot="model" />
    </div>

    <div class="text-center">
      <h1 class="headline" data-role="headline" data-importance="primary">VOGUE</h1>
    </div>

    <div class="text-bottom">
      <p class="subtitle" data-role="subtitle" data-importance="secondary">Timeless silhouettes for the contemporary soul</p>
      <span class="cta-link" data-role="cta" data-importance="primary">DISCOVER MORE</span>
    </div>
  </div>
</body>
</html>
